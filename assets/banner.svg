<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Celeste-inspired mountain banner">
  <defs>
    <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#070c1a"/>
      <stop offset="26%" stop-color="#121e3e"/>
      <stop offset="62%" stop-color="#2e2d5d"/>
      <stop offset="100%" stop-color="#8d7db0"/>
    </linearGradient>
    <linearGradient id="mountainBack" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#2c335d"/>
      <stop offset="100%" stop-color="#171e3e"/>
    </linearGradient>
    <linearGradient id="mountainFront" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#101830"/>
      <stop offset="100%" stop-color="#0a1027"/>
    </linearGradient>
    <linearGradient id="snow" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#dfe8ff"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#fff7d8" stop-opacity="0.98"/>
      <stop offset="50%" stop-color="#fff7d8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#fff7d8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mist" cx="50%" cy="100%" r="80%">
      <stop offset="0%" stop-color="#d8c0ff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#d8c0ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="80%">
      <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.42"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" fill="url(#sky)"/>

  <g opacity="0.9" fill="#ffffff">
    <circle cx="80" cy="58" r="1.7"/>
    <circle cx="170" cy="92" r="1.2" opacity="0.62"/>
    <circle cx="262" cy="38" r="1.8"/>
    <circle cx="334" cy="70" r="1.1" opacity="0.56"/>
    <circle cx="410" cy="42" r="1.9"/>
    <circle cx="492" cy="98" r="1.1" opacity="0.52"/>
    <circle cx="566" cy="42" r="1.5"/>
    <circle cx="642" cy="80" r="1.0" opacity="0.48"/>
    <circle cx="720" cy="36" r="1.7"/>
    <circle cx="796" cy="104" r="1.2" opacity="0.6"/>
    <circle cx="872" cy="46" r="1.8"/>
    <circle cx="946" cy="90" r="1.1" opacity="0.5"/>
    <circle cx="1034" cy="54" r="1.6"/>
    <circle cx="1110" cy="84" r="1.2" opacity="0.58"/>
    <circle cx="1168" cy="120" r="1.4" opacity="0.68"/>
  </g>

  <g filter="url(#glow)">
    <circle cx="1000" cy="76" r="108" fill="url(#moonGlow)"/>
    <circle cx="1000" cy="76" r="24" fill="#fff3d6"/>
  </g>

  <rect y="146" width="1200" height="174" fill="url(#mist)"/>

  <path d="M0 254 L96 224 L176 244 L272 158 L350 194 L436 108 L506 170 L612 124 L720 200 L804 142 L908 214 L1008 176 L1098 220 L1200 194 L1200 320 L0 320 Z" fill="url(#mountainBack)"/>
  <path d="M432 108 L466 146 L432 160 L398 136 Z" fill="url(#snow)" opacity="0.9"/>
  <path d="M270 158 L298 196 L270 206 L242 182 Z" fill="url(#snow)" opacity="0.82"/>
  <path d="M610 124 L638 160 L610 170 L582 146 Z" fill="url(#snow)" opacity="0.8"/>
  <path d="M804 142 L828 176 L804 186 L780 168 Z" fill="url(#snow)" opacity="0.8"/>

  <path d="M0 320 L0 286 L188 250 L342 270 L522 184 L706 254 L864 218 L1012 262 L1200 238 L1200 320 Z" fill="url(#mountainFront)"/>

  <path d="M0 320 L0 302 L188 292 L334 306 L522 290 L704 306 L864 292 L1012 306 L1200 296 L1200 320 Z" fill="#edf3ff" opacity="0.96"/>

  <g fill="#ffffff" opacity="0.8">
    <circle cx="120" cy="312" r="1.5"/>
    <circle cx="246" cy="304" r="1.3"/>
    <circle cx="398" cy="312" r="1.6"/>
    <circle cx="606" cy="302" r="1.2"/>
    <circle cx="742" cy="310" r="1.4"/>
    <circle cx="904" cy="302" r="1.2"/>
    <circle cx="1068" cy="312" r="1.4"/>
  </g>

  <g transform="translate(518,262)" shape-rendering="crispEdges">
    <rect x="0" y="0" width="16" height="6" fill="#df3c4d"/>
    <rect x="1" y="6" width="14" height="8" fill="#f2c9a1"/>
    <rect x="0" y="14" width="16" height="12" fill="#4f90d8"/>
    <rect x="0" y="26" width="7" height="7" fill="#2c3c66"/>
    <rect x="9" y="26" width="7" height="7" fill="#2c3c66"/>
  </g>

  <g transform="translate(180,268)">
    <path d="M0 9 C6 9 6 17 0 27 C-6 17 -6 9 0 9 Z" fill="#e53d4d"/>
    <path d="M-7 5 L0 0 L7 5 L0 8 Z" fill="#4faf63"/>
    <circle cx="-3" cy="14" r="1.1" fill="#9d1d23"/>
    <circle cx="3" cy="14" r="1.1" fill="#9d1d23"/>
  </g>

  <g transform="translate(1026,276) scale(0.8)">
    <path d="M0 9 C6 9 6 17 0 27 C-6 17 -6 9 0 9 Z" fill="#e53d4d"/>
    <path d="M-7 5 L0 0 L7 5 L0 8 Z" fill="#4faf63"/>
    <circle cx="-3" cy="14" r="1.1" fill="#9d1d23"/>
    <circle cx="3" cy="15" r="1.1" fill="#9d1d23"/>
  </g>

  <rect width="1200" height="320" fill="url(#vignette)"/>
</svg>
